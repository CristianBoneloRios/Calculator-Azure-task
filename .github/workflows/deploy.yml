name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Debug FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          echo "SERVER=[$FTP_SERVER]"
          echo "USER=[$FTP_USERNAME]"

      - name: Subir archivos por FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          FTP_SERVER_CLEAN="$(printf '%s' "$FTP_SERVER" | tr -d '\r\n' | xargs)"
          FTP_USERNAME_CLEAN="$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n' | xargs)"
          FTP_PASSWORD_CLEAN="$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')"

          if [ -z "$FTP_SERVER_CLEAN" ] || [ -z "$FTP_USERNAME_CLEAN" ] || [ -z "$FTP_PASSWORD_CLEAN" ]; then
            echo "Uno o mas secrets FTP estan vacios."
            exit 1
          fi

          lftp -e "
            set ftp:passive-mode true;
            set ftp:ssl-allow false;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            open -p 21 ftp://$FTP_SERVER_CLEAN;
            user \"$FTP_USERNAME_CLEAN\" \"$FTP_PASSWORD_CLEAN\";
            mirror -R --delete --verbose --parallel=2 --exclude-glob .git* --exclude .github ./ /public_html/;
            bye
          "
